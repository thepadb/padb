# Local development services. See ADR 0015
services:
    db:
        image: postgis/postgis:18-3.7
        # Image is amd64-only; Apple Silicon runs it via emulation (Rosetta)
        platform: linux/amd64
        environment:
            POSTGRES_USER: padb
            POSTGRES_PASSWORD: padb
            POSTGRES_DB: padb
        ports:
            # Override with DB_PORT if 5432 is taken
            - "127.0.0.1:${DB_PORT:-5432}:5432"
        volumes:
            # Postgres 18+ images keep data under /var/lib/postgresql/<major>
            - db-data:/var/lib/postgresql
        tmpfs:
            # Hides the image's 10_postgis.sh, which would run CREATE EXTENSION postgis. See ADR 0015
            - /docker-entrypoint-initdb.d
        healthcheck:
            # Over TCP, so the socket-only server used during first-run init does not count as healthy
            test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U padb -d padb"]
            interval: 2s
            timeout: 5s
            retries: 15

    # The deployed images, run locally with `just docker-up`; left out of `just serve`
    api:
        profiles: [app]
        build:
            context: .
            dockerfile: apps/api/Dockerfile
        image: ghcr.io/thepadb/padb-api:local
        environment:
            DATABASE_URL: postgres://padb:padb@db:5432/padb
        ports:
            # Public only; the internal port stays on the Compose network. See ADR 0014
            - "127.0.0.1:${API_PORT:-3000}:3000"
        depends_on:
            db:
                condition: service_healthy

    website:
        profiles: [app]
        build:
            context: .
            dockerfile: apps/website/Dockerfile
        image: ghcr.io/thepadb/padb-website:local
        environment:
            API_URL: http://api:3000
        ports:
            - "127.0.0.1:${WEBSITE_PORT:-3100}:3100"
        depends_on:
            - api

volumes:
    db-data:
