[package]
name = "padb-api"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
utoipa = { version = "6.0.0", features = ["uuid"] }
utoipa-scalar = { version = "0.4.0", features = ["axum"] }
uuid = { version = "1.29.3", features = ["v7", "serde"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
