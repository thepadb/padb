name: Deploy

# The only workflow that references secrets, and it runs only on pushes to main
on:
    push:
        branches: [main]

permissions:
    contents: read

# Deploys run in push order; a newer one waits rather than cancelling one mid-flight
concurrency:
    group: deploy-staging
    cancel-in-progress: false

jobs:
    check:
        uses: ./.github/workflows/ci.yml

    image:
        needs: check
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        strategy:
            matrix:
                app: [api, website]
        steps:
            - uses: actions/checkout@v7
            - uses: docker/setup-buildx-action@v4
            - uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - uses: docker/build-push-action@v7
              with:
                  context: .
                  file: apps/${{ matrix.app }}/Dockerfile
                  push: true
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/padb-${{ matrix.app }}:staging
                      ghcr.io/${{ github.repository_owner }}/padb-${{ matrix.app }}:${{ github.sha }}
                  cache-from: type=gha,scope=${{ matrix.app }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.app }}

    deploy:
        needs: image
        runs-on: ubuntu-latest
        environment:
            name: staging
            url: https://staging.thepadb.org
        steps:
            - name: Trigger the Dokploy deploy
              env:
                  DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
              run: curl --fail --silent --show-error --request POST "$DOKPLOY_WEBHOOK_URL"
